name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-safety:
    name: Tests and safety (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Public-safety check (forbidden files, secrets, personal paths)
        run: python tools/check_public_safety.py --all

      - name: Tests
        run: pytest -q
